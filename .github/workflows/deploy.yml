name: deploy

# {Check, Build, Test} -> Deploy -> Restart, with an independent frontend and
# backend lane in every stage. A failure names itself: `check-frontend` red means
# a lint or typecheck problem in web/, `test-backend` red means the Go suite.
# Nothing has to be opened to learn which side broke.
#
# The braces are the point: those three run **at once**, not in sequence. They
# used to be a chain, and the chain cost more than everything in it -- the Go
# module graph was compiled from scratch in all three, one after another, 31s
# then 38s then 39s of a 202s release. Nothing in Check produces anything Build
# or Test reads; the chain only ever expressed the order somebody wanted to read
# the results in.
#
# What did tie Test to Build was one assertion each: `./easydnd -version` and the
# bundle's own version.json must equal the commit SHA. Both now run in the job
# that *makes* the artifact, a step after the build and before the upload, which
# is where they always belonged -- an assertion about a build belongs beside the
# build. Test downloads nothing.
#
# The price of unchaining them is that Check is no longer an ancestor of
# anything, so it no longer gates anything for free. The Deploy jobs name it in
# `needs` and test its result by hand. Read those two `if` blocks before touching
# them: they already lift the implicit `success()` gate for `-notest`, so a
# missing clause there does not fail loudly, it ships.
#
# The lanes stay separate all the way into releases/<sha>/ on the server. Only
# `restart` flips the symlink, because nginx serves the frontend from inside the
# same release directory the binary lives in: one swap, one restart, one
# rollback, one SHA. Splitting that would let the API and the bundle drift apart
# mid-release, which is exactly what the public health gates exist to catch.
#
# The Test stage is skippable, and only by naming the tag for it: a `v*` tag
# ending in `-notest` drops both test jobs. It is for a release whose checks were
# just run by hand -- `make verify` is the real gate anyway, since nothing runs
# on main. What it costs is spelled out at the Test stage below, and it is less
# than it was: the two version assertions live in Build now, so `-notest` gives
# up the suites and keeps the checks that catch a silent ldflags no-op. The
# suffix reaches one further thing, and only in what a release calls itself: the
# identifier is the tag, so `v1.0.4-notest` ships reporting `v1.0.4-notest`. That
# is left alone rather than trimmed back to `v1.0.4`. A release that skipped its
# suites should say so wherever anyone reads its version, and two releases that
# both answered `v1.0.4` while being built from different decisions would be
# worse than an ugly string. Every path on the server is still keyed by
# GITHUB_SHA, so the artifact and the release directory cannot tell a `-notest`
# tag from any other.

on:
  # TAGS ONLY. A push to main runs nothing at all -- not even the tests.
  # Everything this workflow does, including the build, is gated behind a
  # deliberate `git tag -a vX.Y.Z && git push origin vX.Y.Z`. Run the checks
  # locally with `make verify` before tagging; there is no CI on main to catch
  # what you miss.
  push:
    tags:
      - 'v*'

      # A dry run: `git tag ci/whatever && git push origin ci/whatever` runs
      # Check, Build and Test exactly as a release does, and cannot ship.
      #
      # Nothing below had to be taught about it. Deploy and Restart already ask
      # `startsWith(github.ref, 'refs/tags/v')`, which a `ci/` ref fails, so
      # they skip on their own. That is the entire mechanism, and it works only
      # because the trigger and the gate are no longer the same condition --
      # until this line they both said "starts with v", so every tag that could
      # start the pipeline could also ship from it.
      #
      # **The prefix must not begin with `v`.** `v*` is a glob, not a version
      # pattern: a tag named `vtest` matches this trigger *and* passes the
      # deploy gate, and would ship whatever it points at to easydnd.org. `ci/`
      # cannot be mistyped into that.
      - 'ci/*'
  workflow_dispatch:

# Nothing here writes to the repository, and the deploy authenticates to the
# server with its own ssh key. Declared because the default is broader.
permissions:
  contents: read

# Releases take turns -- one deploy at a time, and never cancelled halfway,
# because the thing being serialised is a symlink swap on a live server.
#
# A dry run gets a lane of its own, keyed by its ref. Sharing the `deploy` group
# would let a `ci/` tag hold a real release in the queue behind it, which is a
# poor trade for a run that ships nothing. A `workflow_dispatch` on a branch
# lands here too, and for the same reason.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'deploy' || format('dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- CHECK -----
  # Static analysis only. Nothing here compiles an artifact or runs a test.

  check-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # cache: false, and not as a resignation -- the cache in this workflow
      # never worked and could not have. A cache is readable only from the ref
      # that wrote it or from the default branch, and this workflow runs on `v*`
      # tags and nothing else. Every tag is a new ref, so every run missed, wrote
      # ~120 MB under `refs/tags/vX.Y.Z`, and left it there for nobody: twenty-
      # five entries and 2.9 GB of storage that had never once been read. The
      # logs said `Cache is not found` on every run sampled.
      #
      # Turning it on again would need something to run on `main` so the cache
      # lands on the default branch, and nothing runs on `main` by design. Until
      # that changes this is 3-5s of upload per job for nothing.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      # The same targets `make verify` runs, so local and CI cannot drift. Two
      # are worth spelling out:
      #
      # lint/layers -- the inner layers must not import the HTTP framework,
      # net/http, database/sql, pgx or goose. depguard says the same thing at
      # lint time, but golangci is not run here; this grep over the real module
      # graph is, and it is transitive, which is what catches a library that
      # pulls net/http in three hops down.
      #
      # data/srd/check -- the committed compendium must match what cmd/srdgen
      # produces. Without it, a hand-edit to data/srd_5.1 survives until someone
      # regenerates and silently reverts it.
      - name: gofmt, vet, layers, srd drift
        run: make fmt/check vet lint/layers data/srd/check

  check-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No `cache: npm`, for the reason spelled out at check-backend: a
      # tags-only workflow can never read back what it wrote.
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - name: deps
        run: make web/deps
      - name: typecheck, lint, layers
        run: make web/lint

  # ---------------------------------------------------------------- BUILD -----

  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # cache: false -- see check-backend for why it never worked here.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      # The release identifier, from the one script that decides it. Exported
      # rather than left to the Makefile's own default because that default
      # asks git, and a shallow CI checkout cannot be relied on to carry the
      # tags -- see deploy/release-version.sh.
      - name: release identifier
        run: echo "RELEASE_VERSION=$(./deploy/release-version.sh)" >> "$GITHUB_ENV"

      # make build/release owns the ldflags, including the -X path into
      # internal/buildinfo. Keeping the flags in one place means CI cannot ship
      # a binary built differently from what `make verify` produced locally.
      # The step below asserts the injection worked.
      - name: build linux/amd64 binary
        run: make build/release VERSION="${RELEASE_VERSION}"

      # -X against a symbol the linker cannot find is a silent no-op, not an
      # error. Unchecked, a wrong package path ships a binary reporting "dev",
      # which fails deploy.sh's health gate, triggers a rollback and surfaces as
      # an unexplained red deploy minutes later. Catch it before shipping.
      #
      # Here rather than in test-backend, where it used to live. It is an
      # assertion about this build, the binary is on disk two lines up, and
      # putting it here is what lets Test stop waiting for Build -- which was
      # the whole cost of the old chain. It needs no `chmod +x` for the same
      # reason: this file was just built, not unpacked from an artifact that
      # dropped the bit. A `-notest` tag now keeps this check and gives up only
      # the suites.
      - name: binary reports this release
        run: |
          got="$(./easydnd -version)"
          if [ "$got" != "${RELEASE_VERSION}" ]; then
            echo "ldflags injection broken: got '$got', want '${RELEASE_VERSION}'"
            echo "check the -X path in the Makefile against internal/buildinfo"
            exit 1
          fi
          echo "version injection ok: $got"

      - uses: actions/upload-artifact@v7
        with:
          name: api
          path: |
            easydnd
            deploy/deploy.sh
            data/srd_5.1
          retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No `cache: npm`, for the reason spelled out at check-backend: a
      # tags-only workflow can never read back what it wrote.
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - name: deps
        run: make web/deps

      # The same identifier the binary gets, from the same script. The two
      # halves of a release must report the same string or the client's update
      # check compares a bundle against an API that disagrees with it.
      - name: release identifier
        run: echo "RELEASE_VERSION=$(./deploy/release-version.sh)" >> "$GITHUB_ENV"

      # make web/release passes VITE_APP_VERSION=$(VERSION) and tars web/dist.
      # That variable is not optional: vite.config.ts refuses to build without
      # it, so a bundle can never ship silently reporting "dev". The step below
      # asserts the value actually landed in the bundle.
      - name: build and tar the bundle
        run: make web/release VERSION="${RELEASE_VERSION}"

      # The frontend's half of the version contract, and the exact counterpart
      # to the binary check above -- here for the same reason, an assertion
      # about this build beside the build. vite.config.ts emits version.json
      # into the bundle so a release can be identified from the browser, and
      # restart reads it through the public URL; a bundle not carrying the
      # identifier would fail the deploy minutes after this cheap check can
      # catch it.
      #
      # Unpacks the archive rather than reading web/dist/version.json, and that
      # is deliberate: proving the tarball is well formed is half of what this
      # asserts, and it is the tarball that ships. Extracts everything rather
      # than naming one member, because `make web/release` tars with
      # `-C web/dist .`, so every entry is prefixed `./` and asking tar for
      # `version.json` fails with "Not found in archive".
      #
      # Matches the JSON field with -F rather than grepping the body for the
      # identifier loose. Both halves of that matter now that the identifier is
      # a tag: `v1.0.4` is a substring of `v1.0.40`, and to grep-as-regex the
      # `.` in it matches any character at all. deploy/deploy.sh's health gate
      # is anchored the same way, for the same reason.
      - name: bundle reports this release
        run: |
          mkdir -p bundle
          tar -xzf web.tar.gz -C bundle
          echo "bundle version.json: $(cat bundle/version.json)"
          grep -qF "\"version\":\"${RELEASE_VERSION}\"" bundle/version.json || {
            echo "bundle does not report ${RELEASE_VERSION}"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: web.tar.gz
          retention-days: 7

  # ----------------------------------------------------------------- TEST -----
  # Both jobs are skipped by a `-notest` tag, and that is now all the suffix
  # buys. The two version assertions moved up into Build, where the artifact
  # they are about is made, so a `-notest` release still proves the SHA landed
  # in the binary and in the bundle. What it gives up is the suites -- for a
  # release whose `make verify` you have just run yourself.
  #
  # Neither job needs its lane's Build any more. Nothing here reads an artifact.

  test-backend:
    if: ${{ !endsWith(github.ref, '-notest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Postgres adapter owns account durability, and its tests skip themselves
    # when TEST_DATABASE_URL is unset. Without this container they would skip
    # here too, and the first time anyone learned that a constraint name or an
    # error mapping was wrong would be during a deploy.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easydnd
          POSTGRES_PASSWORD: easydnd
          POSTGRES_DB: easydnd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easydnd -d easydnd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      # cache: false -- see check-backend for why it never worked here.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      # make test/db, not make test/unit, and the difference is `-p 1`.
      #
      # Three packages reach the one database and each opens by wiping it --
      # internal/adapter/repository/postgres (users, and groups), and
      # internal/api/http's durability test. Run in parallel, one truncates the
      # table another has just written and the red lands on whichever lost the
      # race rather than on whichever caused it. `make test/db` exists to stop
      # exactly that, and its comment in the Makefile is the long version.
      #
      # This job was running `make test/unit` -- plain `go test ./...` -- with
      # TEST_DATABASE_URL set, which is the one place in the world that
      # combination happens: on a laptop those tests skip and the race cannot
      # occur. It failed the v1.0.1 release, both packages red in the same run,
      # and cost a manual re-run of the whole job. Reproduced locally in one
      # attempt by exporting TEST_DATABASE_URL and running `make test/unit`.
      #
      # The cost is that `-p 1` runs the package binaries one at a time. That is
      # a fixed handful of seconds against an unbounded wait for somebody to
      # notice a red release and press the button.
      #
      # No race detector, here or in `make verify`: it tripled the suite's
      # runtime and two thirds of that was the race runtime's one-second sleep
      # at the exit of each of sixteen test binaries. `make test/race` is the
      # target that still runs it, and the rule is to run it before tagging --
      # which is to say before this workflow ever starts. See
      # docs/backend.md#tests for what that gives up.
      #
      # sslmode=disable: the container has no CA, and this also exercises the
      # branch of newPoolConfig that must leave an explicit disable alone.
      - name: go test, against Postgres
        env:
          TEST_DATABASE_URL: postgres://easydnd:easydnd@localhost:5432/easydnd_test?sslmode=disable
        run: make test/db

  test-frontend:
    if: ${{ !endsWith(github.ref, '-notest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No `cache: npm`, for the reason spelled out at check-backend: a
      # tags-only workflow can never read back what it wrote.
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
      - name: deps
        run: make web/deps
      - name: vitest
        run: make web/test

  # --------------------------------------------------------------- DEPLOY -----
  # Both lanes fill the same releases/<sha>/ and neither touches the symlink.
  # `mkdir -p` from two jobs at once is safe and idempotent.
  #
  # Shipping still needs a v* tag ref. workflow_dispatch survives as a way to
  # re-run a tag that failed halfway (select the tag as the ref); dispatching
  # from a branch checks, builds and tests but cannot ship. GITHUB_SHA on a tag
  # push is the commit the tag points at, so the SHA-keyed release directory is
  # unaffected. The health gate no longer reads that directory name: it reads
  # the VERSION file shipped into it below, because what a release calls itself
  # and where it lives are two different things now.
  #
  # The rest of the `if` is what makes `-notest` work. A job's implicit gate is
  # `success()`, which in a job context means "nothing in my ancestry was
  # skipped or failed" -- so a skipped Test stage takes the whole rest of the
  # pipeline down with it, and a `-notest` tag would build and then ship
  # nothing. Naming a status function (`!cancelled()`) lifts that rule; the
  # result checks then say by hand what it said for free -- the artifact must
  # exist, and a Test stage that ran and failed still stops the release. Only a
  # Test stage that never ran is waved through. `restart` needs the same, for
  # the same reason, one stage further down.
  #
  # `check-*` is in `needs` and in the `if`, and it has to be. Check used to sit
  # upstream of Build, so `success()` gated on it without anyone saying so; now
  # the three run side by side and it gates on nothing by itself. Because
  # `!cancelled()` has already lifted the implicit rule, dropping the clause
  # would not fail loudly -- it would ship a release whose gofmt, vet, layer and
  # SRD-drift checks were red. `== 'success'` and not `!= 'failure'`, unlike the
  # Test line: Check runs on every tag, so there is no legitimate way for it to
  # be skipped.

  deploy-backend:
    needs: [check-backend, build-backend, test-backend]
    if: >-
      ${{ !cancelled()
          && needs.check-backend.result == 'success'
          && needs.build-backend.result == 'success'
          && needs.test-backend.result != 'failure'
          && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: api
      - uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: release identifier
        run: echo "RELEASE_VERSION=$(./deploy/release-version.sh)" >> "$GITHUB_ENV"

      - name: ship the binary, deploy.sh and the compendium
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          REL="/opt/easydnd/releases/${GITHUB_SHA}"
          chmod +x easydnd deploy/deploy.sh
          ssh -i ~/.ssh/id_deploy "deploy@$HOST" "mkdir -p $REL/data /opt/easydnd/bin"
          scp -i ~/.ssh/id_deploy easydnd "deploy@$HOST:$REL/easydnd"
          scp -i ~/.ssh/id_deploy deploy/deploy.sh "deploy@$HOST:/opt/easydnd/bin/deploy.sh"

          # What this release calls itself, recorded beside the binary that
          # says it. The directory is named by commit SHA and the binary
          # reports a tag, so deploy.sh cannot derive one from the other -- and
          # it needs the identifier twice: once to gate this release, and once
          # more to gate whatever it rolls back to. Piped rather than
          # interpolated into the remote command, so no quoting of ours has to
          # survive a second round of shell parsing on the far side.
          printf '%s\n' "${RELEASE_VERSION}" \
            | ssh -i ~/.ssh/id_deploy "deploy@$HOST" "cat > $REL/VERSION"

          # The SRD data is ~1.7 MB across 50-odd files in nested directories.
          # One tar beats fifty scp round trips, and lands the tree atomically
          # enough that deploy.sh's existence check is meaningful.
          tar -czf srd.tgz -C data srd_5.1
          scp -i ~/.ssh/id_deploy srd.tgz "deploy@$HOST:$REL/srd.tgz"
          ssh -i ~/.ssh/id_deploy "deploy@$HOST" \
            "tar -xzf $REL/srd.tgz -C $REL/data && rm -f $REL/srd.tgz"

  deploy-frontend:
    needs: [check-frontend, build-frontend, test-frontend]
    if: >-
      ${{ !cancelled()
          && needs.check-frontend.result == 'success'
          && needs.build-frontend.result == 'success'
          && needs.test-frontend.result != 'failure'
          && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout FIRST: it cleans the workspace, so downloading the artifact
      # before it would simply delete the artifact. Only needed at all because
      # the local composite action below has to exist on disk.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
      - uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      # Only places the tarball. deploy.sh unpacks it during restart and checks
      # web/index.html exists before swapping -- a bundle that unpacked badly
      # would otherwise go live as a blank site, an outage the API-side gate
      # cannot even see.
      - name: ship the bundle
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          REL="/opt/easydnd/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/id_deploy "deploy@$HOST" "mkdir -p $REL"
          scp -i ~/.ssh/id_deploy web.tar.gz "deploy@$HOST:$REL/web.tar.gz"

  # -------------------------------------------------------------- RESTART -----

  # The `if` is the deploy jobs' one, and for the same reason -- with a twist
  # that cost a release to learn. A job's implicit gate is `success()`, and in
  # a job context that is not "my needs succeeded" but "no job anywhere in my
  # ancestry was skipped or failed". The Test stage is this job's ancestor
  # through the deploy jobs, so a -notest tag skipped `restart` even though
  # both deploys reported success: artifacts uploaded, symlink never swapped,
  # and a green run that shipped nothing. Naming a status function lifts that,
  # and the result checks then say the part that was actually meant.
  restart:
    needs: [deploy-backend, deploy-frontend]
    if: >-
      ${{ !cancelled()
          && needs.deploy-backend.result == 'success'
          && needs.deploy-frontend.result == 'success'
          && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Two grey boxes in the Test stage are ambiguous at a glance -- skipped
      # on purpose and skipped because something upstream died look alike. Say
      # which this release was, on the run's own summary page.
      - name: note the skipped Test stage
        if: ${{ endsWith(github.ref, '-notest') }}
        run: |
          {
            echo "### Shipped without the Test stage"
            echo
            echo "Tag \`${GITHUB_REF_NAME}\` ends in \`-notest\`: neither suite ran."
            echo
            echo "Both version assertions still ran -- they live in Build, beside the artifacts they are about."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
      - uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: release identifier
        run: echo "RELEASE_VERSION=$(./deploy/release-version.sh)" >> "$GITHUB_ENV"

      # The single point where a release goes live, which is what keeps
      # deploy.sh's rollback a meaningful undo: pre-swap checks, atomic symlink
      # swap, supervisor restart, health gate, rollback on failure, prune.
      #
      # Still handed the SHA: the argument names the release *directory*, which
      # is keyed by commit and always was. deploy.sh reads what the release
      # calls itself from the VERSION file deploy-backend wrote beside it.
      - name: swap, restart, health gate, rollback
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "deploy@$HOST" \
            "chmod +x /opt/easydnd/bin/deploy.sh && /opt/easydnd/bin/deploy.sh ${GITHUB_SHA}"

      #
      # Anchored on the JSON field, like deploy.sh's gate and the bundle
      # assertion in Build: a tag is a substring of longer tags, and a regex
      # match would read the dots in it as wildcards.
      - name: verify the public API serves this release
        run: |
          want="\"version\":\"${RELEASE_VERSION}\""
          for i in $(seq 1 15); do
            body=$(curl -fsS -m 5 https://easydnd.org/v1/version || true)
            if printf '%s' "$body" | grep -qF "$want"; then
              echo "api live: $body"; exit 0
            fi
            sleep 2
          done
          echo "public /v1/version did not report ${RELEASE_VERSION}"; exit 1

      # Separate from the API check because they fail for different reasons and
      # the fix differs: a stale bundle here means nginx is serving a cached
      # index.html or its root is not following the current symlink, which the
      # API check cannot see.
      - name: verify the public site serves this release
        run: |
          want="\"version\":\"${RELEASE_VERSION}\""
          for i in $(seq 1 15); do
            body=$(curl -fsS -m 5 https://easydnd.org/version.json || true)
            if printf '%s' "$body" | grep -qF "$want"; then
              echo "web live: $body"; exit 0
            fi
            sleep 2
          done
          echo "public /version.json did not report ${RELEASE_VERSION}"; exit 1

      # Strictly redundant -- a missing auth.session_secret fails config.Load,
      # so the process would never start and the version gate above would have
      # rolled the release back already. It costs one request and independently
      # proves the auth routes are mounted and the session guard is live, which
      # neither check above can see.
      - name: verify the session guard is live
        run: |
          # Not curl -fsS: the expected answer IS a 401, which --fail treats as
          # an error.
          code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' https://easydnd.org/v1/auth/me)
          if [ "$code" != "401" ]; then
            echo "GET /v1/auth/me returned $code, want 401"
            exit 1
          fi
          echo "session guard live: unauthenticated /v1/auth/me is 401"
