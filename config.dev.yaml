# Development configuration, loaded by every `make` target that runs the API.
#
# Committed on purpose: the config file is mandatory in every environment, so
# there has to be one in the repo. It contains no secret -- see auth below.
#
# Every key is optional; the loader has defaults for all of them. What is here
# is only what differs from those defaults, plus the two values worth stating
# out loud because they are what a passkey binds to.

env: development

log:
  # Human-readable rather than the JSON production ships, at debug level.
  format: text
  level: debug

data:
  # Relative to the repo root, which is where `make run/server` runs.
  srd_dir: data/pack/srd-5.1
  # Optional file-defined packs; see docs/packs.md.
  pack_files: []
  autoload_packs: []
  default_packs: {}
  # Set to .pack-archive when retaining released packs between runs.
  pack_archive: ""

auth:
  # Passkeys created against this config are bound to localhost and are
  # therefore useless in production, which is exactly what we want.
  rp_id: localhost
  rp_origins:
    - http://localhost:5173

  # NO session_secret here, deliberately. Development generates a random key per
  # process and logs a warning: every restart signs everyone out, which matches
  # the in-memory account store losing every account on the same restart.
  # Production refuses to start this way.

  # NO google block here either: the client id and secret do not belong in a
  # committed file, so without them the sign-in page simply does not draw the
  # button. To work on it, put EASYDND_GOOGLE_CLIENT_ID and
  # EASYDND_GOOGLE_CLIENT_SECRET in ~/config/easydnd/dev.env. The redirect URL
  # defaults to /v1/auth/sso/google/callback on this worktree's first origin --
  # `make ports` says which that is -- so register that exact URI on the client.

# NO db section here, deliberately. With db.url unset the server runs on the
# in-memory account store and logs a warning -- which is what lets `make
# run/server`, `go test ./...` and `make verify` work on a machine with no
# Postgres at all. Production refuses to start this way.
#
# For durable accounts locally, `make dev` -- it claims this worktree's ports,
# starts a Postgres of its own, and hands the API that slot's port, origins and
# database URL through the environment. Nothing per-worktree is written to a
# file; see docs/backend.md#running-more-than-one-worktree.

# The AI Wizard. The key is EASYDND_AGENT_API_KEY in ~/config/easydnd/dev.env;
# without it the feature is off. See docs/agent.md#which-model for the choice.
agent:
  model: gpt-6-luna
