# A throwaway Postgres for development and for the adapter tests.
#
# Nothing here resembles production: production is AWS RDS, reached over TLS
# with the CA bundle compiled into the binary. This exists so that `make db/up
# && make test/db` works on a laptop, and so that a contributor can run the API
# with durable accounts without an AWS account.
#
# Port 5433, not 5432, so a Postgres already installed on the machine keeps
# working and nobody points the tests at their own data by accident.
# Named explicitly: compose otherwise derives the project name from the
# directory, which here is "local" -- generic enough to collide with another
# checkout's deploy/local and adopt its containers.
name: easydnd

services:
  postgres:
    image: postgres:17-alpine
    container_name: easydnd-postgres
    environment:
      POSTGRES_USER: easydnd
      POSTGRES_PASSWORD: easydnd
      POSTGRES_DB: easydnd
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easydnd -d easydnd"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No volume on purpose. `make db/down` should leave nothing behind, and a
    # stale local database that outlives a schema change is a debugging session
    # nobody enjoys.
