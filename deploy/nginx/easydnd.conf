# nginx site for easydnd.org.
#
# NOT APPLIED AUTOMATICALLY. Like the supervisor program definition, the live
# copy lives on the server; this file is the source of truth for what it should
# say. To apply:
#
#   sudo cp deploy/nginx/easydnd.conf /etc/nginx/sites-available/easydnd
#   sudo ln -sfn /etc/nginx/sites-available/easydnd /etc/nginx/sites-enabled/easydnd
#   sudo nginx -t && sudo systemctl reload nginx
#
# /opt/easydnd is mode 2750, owned by deploy:easydnd, so the worker cannot
# traverse it out of the box. Add nginx to the owning group rather than
# chmod o+x, which would open the tree to every local user:
#
#   sudo usermod -aG easydnd www-data
#   sudo systemctl restart nginx   # NOT reload: supplementary groups are read
#                                  # when a worker starts, not when it reloads
#
# Depends on a $connection_upgrade map in the http{} block (the usual
# `map $http_upgrade $connection_upgrade { default upgrade; "" close; }`),
# which lives in the main nginx.conf, not here.
#
# The certificate paths are certbot's. Renewals rewrite nothing in this file,
# but a `certbot --nginx` run may: keep this copy in step if it does.

server {
    listen 80;
    listen [::]:80;
    server_name easydnd.org www.easydnd.org;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://easydnd.org$request_uri; }
}

# www -> apex, so the app has exactly one origin and the service worker,
# manifest scope and the session cookie never straddle two hostnames.
#
# This is now a security control rather than tidiness. The session cookie is
# named __Host-easydnd_session, and a browser treats a __Host- cookie set on
# www.easydnd.org as a *different* cookie from one set on the apex. The
# redirect is what stops anyone from ever observing that. It is also why
# auth.rp_id is the apex: a passkey registered against easydnd.org keeps
# working on any future subdomain, and the reverse is impossible.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.easydnd.org;

    ssl_certificate /etc/letsencrypt/live/easydnd.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easydnd.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://easydnd.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name easydnd.org;

    ssl_certificate /etc/letsencrypt/live/easydnd.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easydnd.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/easydnd.access.log;

    # Now that a session cookie exists, a single plain-HTTP request is a chance
    # to strip it. `always` so it is sent on error responses too, which is
    # exactly when a browser is most likely to be talking to something that is
    # not us. No includeSubDomains: it would commit every future subdomain to
    # HTTPS before one exists to test.
    #
    # REPEATED IN EVERY location BELOW THAT SETS A HEADER OF ITS OWN. nginx's
    # add_header does not merge: a block with any add_header of its own
    # discards every inherited one. Without the repetition this header would
    # silently vanish from exactly the response that matters most -- the
    # index.html a browser loads on its first visit.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Follows the release symlink, so the atomic swap in deploy/deploy.sh moves
    # the site and the API to the new release together. Leave open_file_cache
    # off (the default): with it on, nginx would keep serving the previous
    # release's files from cached descriptors after the swap.
    #
    # Until the first release carrying a frontend is deployed this directory
    # does not exist, and / returns 404 while /v1/ keeps working.
    root /opt/easydnd/current/web;
    index index.html;

    # ---- API -------------------------------------------------------------
    # Everything under /v1/ belongs to the Go process, which binds loopback
    # only. Proxying from 127.0.0.1 is also what makes the app's
    # http.trusted_proxies default (127.0.0.1, ::1) match, so gin's ClientIP
    # trusts the X-Forwarded-For set here and nothing a client sends.
    #
    # A longest-prefix match, so it wins over `location /` below whatever the
    # order in this file.
    # Cookies need nothing special here: proxy_pass forwards Cookie and
    # Set-Cookie untouched, no proxy_cache is configured, and the app sets
    # Cache-Control: no-store on /v1/auth/ itself. Do not add
    # proxy_cookie_path or proxy_cookie_domain -- rewriting either would break
    # the __Host- prefix the session cookie depends on.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # X-Request-Id passes through untouched; the request-id middleware
        # adopts an inbound one rather than replacing it, so a correlation id
        # minted in the browser survives into the server logs.
        proxy_read_timeout 60s;
    }

    # ---- Static bundle ---------------------------------------------------
    # Vite content-hashes everything under /assets/, so those URLs can never
    # change meaning and are safe to cache forever. One Cache-Control header,
    # not two: `expires` emits its own, and a response carrying both leaves the
    # client to reconcile them.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The opposite case: stable URLs whose contents change every release. A
    # cached index.html points at asset hashes that were pruned five deploys
    # ago, and a cached version.json would make the pipeline's public check
    # pass against the wrong release.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-cache";
        default_type application/json;
    }
    location = /sw.js {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: deep links are client-side routes, so unknown paths get the
    # app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json
               image/svg+xml text/css text/plain;
}
