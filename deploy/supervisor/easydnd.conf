# supervisor program definition for the easydnd API.
#
# NOT APPLIED AUTOMATICALLY. Like the nginx site, the live copy lives on the
# server; this file is the source of truth for what it should say. To apply:
#
#   sudo cp deploy/supervisor/easydnd.conf /etc/supervisor/conf.d/easydnd.conf
#   sudo supervisorctl reread && sudo supervisorctl update
#
# INSTALL /etc/easydnd/config.yaml FIRST. Everything the app used to read from
# the environment= line below -- including the session signing key -- now lives
# in that one YAML file, and the process refuses to start without it. See
# deploy/config.example.yaml for the template and the install commands. Applying
# this file before the config exists leaves the service crash-looping.
#
# This file no longer needs `chmod 600`: EASYDND_CONFIG is a path, not a secret.
# The permissions that matter are now on /etc/easydnd/config.yaml (640
# root:easydnd), which is a far better place for them -- one file to protect,
# and the app warns at startup if it is world-readable.
#
# Two supervisor quirks if you ever add to the environment= line: a literal %
# must be escaped as %%, and a value containing a comma must be quoted. Neither
# applies to a single path, which is part of the point.
#
# Keep `stopwaitsecs` above the app's http.shutdown_timeout (default 5s), or the
# drain is cut short by SIGKILL and graceful shutdown never completes.
#
# The port lives in the config file's http.port. deploy.sh health-checks
# 127.0.0.1:8080 and the nginx site proxies to the same number, so all three
# have to agree.

[program:easydnd]
command=/opt/easydnd/current/easydnd
user=easydnd
directory=/opt/easydnd
environment=EASYDND_CONFIG="/etc/easydnd/config.yaml"
autostart=true
autorestart=true
startsecs=3
# Bounded because the process now depends on a database it does not control.
# With autorestart and no limit, an RDS outage makes supervisor respawn forever
# and fill /var/log/easydnd/err.log; entering FATAL after a few tries says
# plainly that the service cannot start, which is the truth.
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/easydnd/out.log
stderr_logfile=/var/log/easydnd/err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
