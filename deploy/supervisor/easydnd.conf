# supervisor program definition for the easydnd API.
#
# NOT APPLIED AUTOMATICALLY. Like the nginx site, the live copy lives on the
# server; this file is the source of truth for what it should say. To apply:
#
#   sudo cp deploy/supervisor/easydnd.conf /etc/supervisor/conf.d/easydnd.conf
#   sudo supervisorctl reread && sudo supervisorctl update
#
# INSTALL /etc/easydnd/prod.env FIRST, from easydnd.example.env:
#
#   sudo install -d -o root -g easydnd -m 751 /etc/easydnd
#   sudo install -o root -g easydnd -m 640 easydnd.example.env /etc/easydnd/prod.env
#   sudo -e /etc/easydnd/prod.env
#
# It holds every secret -- the session signing key, the database URL, the LLM
# key -- and the process refuses to start without the first two. The settings
# that are not secret are in config.prod.yaml, which ships inside each release
# as config.yaml; EASYDND_CONFIG below follows `current` to it.
#
# The command is a shell for exactly one reason: supervisor has no way to read
# an env file. `set -a` exports what the file assigns and `exec` replaces the
# shell, so supervisor still signals the server itself.
#
# This file needs no `chmod 600`: it names two paths and no secret.
#
# GOMEMLIMIT is a ceiling for a 1 GB host. v1.1.0 copied the 22 MB pack on
# every request, reached 600 MB within a minute of its first sign-in, and the
# kernel killed it; this limit is what held it near 420 MB. The copying is
# gone -- the process now sits around 225 MB whatever the load -- so the limit
# is no longer doing the work, only bounding a surprise. It is a soft limit;
# raise it with the host. The host also carries a 2 GB swap file as backstop.
#
# Keep `stopwaitsecs` above the app's http.shutdown_timeout (default 5s), or the
# drain is cut short by SIGKILL and graceful shutdown never completes.
#
# The port lives in config.prod.yaml's http.port. deploy.sh health-checks
# 127.0.0.1:8080 and the nginx site proxies to the same number, so all three
# have to agree.

[program:easydnd]
command=/bin/sh -c 'set -a; . /etc/easydnd/prod.env; exec /opt/easydnd/current/easydnd'
user=easydnd
directory=/opt/easydnd
environment=EASYDND_CONFIG="/opt/easydnd/current/config.yaml",GOMEMLIMIT="400MiB"
autostart=true
autorestart=true
startsecs=3
# Bounded because the process now depends on a database it does not control.
# With autorestart and no limit, an RDS outage makes supervisor respawn forever
# and fill /var/log/easydnd/err.log; entering FATAL after a few tries says
# plainly that the service cannot start, which is the truth.
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/easydnd/out.log
stderr_logfile=/var/log/easydnd/err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
