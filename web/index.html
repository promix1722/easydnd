<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      `interactive-widget=resizes-content` is the one part of this that is not
      boilerplate, and it is here for the bottom sheet.

      By default a soft keyboard resizes only the *visual* viewport: the layout
      viewport stays the full height of the screen, so an element anchored to
      its bottom -- which is what `ui/ModalSheet` becomes on a phone -- is left
      sitting behind the keyboard. Every rename and create dialog in this app
      put its field there, so typing into one meant typing into something you
      could not see. `resizes-content` shrinks the layout viewport instead, so
      the sheet lands on top of the keyboard and `dvh` means what it says.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Rewritten at dev and build time from src/theme/palettes.ts; see the
         theme-colour plugin in vite.config.ts. The literal is what the tag
         currently resolves to, kept honest so reading this file does not
         mislead. -->
    <meta name="theme-color" content="#99051d" />
    <meta
      name="description"
      content="Build D&amp;D 5e characters, organize groups, and run sessions with initiative, hit points, conditions, and turns. Built for the 2014 rules and SRD 5.1."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://easydnd.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="easydnd.org" />
    <meta property="og:url" content="https://easydnd.org/" />
    <meta
      property="og:title"
      content="easydnd.org — D&amp;D 5e Character Builder &amp; Session Manager"
    />
    <meta
      property="og:description"
      content="Build D&amp;D 5e characters, organize groups, and run sessions with initiative, hit points, conditions, and turns. Built for the 2014 rules and SRD 5.1."
    />
    <meta property="og:image" content="https://easydnd.org/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The easydnd red dragon mark" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="easydnd.org — D&amp;D 5e Character Builder &amp; Session Manager"
    />
    <meta
      name="twitter:description"
      content="Build D&amp;D 5e characters, organize groups, and run sessions with initiative, hit points, conditions, and turns. Built for the 2014 rules and SRD 5.1."
    />
    <meta name="twitter:image" content="https://easydnd.org/icons/icon-512.png" />
    <meta name="twitter:image:alt" content="The easydnd red dragon mark" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "easydnd.org",
        "url": "https://easydnd.org/",
        "description": "Build D&D 5e characters, organize groups, and run sessions with initiative, hit points, conditions, and turns. Built for the 2014 rules and SRD 5.1.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "image": "https://easydnd.org/icons/icon-512.png",
        "featureList": [
          "D&D 5e character creation",
          "Group management and character sharing",
          "Session management with initiative, hit points, conditions, and turns",
          "2014 rules and SRD 5.1"
        ]
      }
    </script>
    <!-- i18n-exempt: the product's name, and read before any JS runs. -->
    <title>easydnd.org — D&amp;D 5e Character Builder &amp; Session Manager</title>
  </head>
  <body>
    <!--
      The English landing copy, in <noscript> and outside #root. Both halves of
      that matter.

      Outside #root because main.tsx calls createRoot, not hydrateRoot. React
      does not adopt what it finds in the container; it discards it at the first
      commit. So copy left in there is the *painted page* for as long as the
      bundle takes to arrive -- unstyled, because it carries no classes and
      Mantine's stylesheet only resets bare h1/p/nav. Under `make dev`, where
      Vite transforms the module graph cold, that was ten seconds of raw
      browser-default HTML. An empty #root spends the same wait as a blank page,
      which is what it did before this copy existed.

      In <noscript> because a browser with JavaScript on never renders it, while
      every consumer this was written for still receives it: it is in the bytes
      the server sends, so a crawler that does not execute JavaScript, a link
      unfurler and a text-only agent all parse it. Google does execute
      JavaScript, and reads routes/LandingPage.tsx, which says the same things
      from locales/en.json.

      The <head> above is the part that never depended on any of this. Title,
      description, canonical, the cards and the JSON-LD are read without
      rendering anything at all.
    -->
    <noscript>
      <main>
        <h1>Build a D&amp;D character</h1>
        <p>
          Create your character step by step. Choose a race, class, background,
          and skills — easydnd takes care of the character sheet and
          calculations.
        </p>
        <section>
          <h2>Join a group</h2>
          <p>
            Bring players together with an invite link. Add your characters,
            choose your roles, and start playing together.
          </p>
        </section>
        <section>
          <h2>Run sessions</h2>
          <p>
            Keep everything you need to play in one place. Manage encounters,
            initiative, hit points, conditions, and turns.
          </p>
        </section>
        <nav aria-label="Public pages">
          <a href="/login">Log in</a>
          <a href="/legal">Legal and SRD attribution</a>
        </nav>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
